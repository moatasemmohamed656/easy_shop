name: app_store
description: "A new Flutter project."

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.4


dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # core
  connectivity_plus: ^7.0.0
  flutter_dotenv: ^6.0.0
  flutter_screenutil: ^5.9.3
  flutter_native_splash: ^2.4.7

  # Network
  dio: ^5.9.1
  retrofit: ^4.9.2
  retrofit_generator: ^10.2.1
  freezed_annotation: ^3.1.0
  get_it: ^9.2.0
  pretty_dio_logger: ^1.4.0
  json_annotation: ^4.9.0

  # Bloc
  flutter_bloc: ^9.1.1
  # Shared prefrance
  shared_preferences: ^2.5.4
  # firebase
  firebase_core: ^4.3.0
  # localizations
  flutter_localization: ^0.3.3
  animate_do: ^4.2.0
  # toast
  fluttertoast: ^9.0.0
  # image picker
  image_picker: ^1.2.1
  permission_handler: ^12.0.1


dev_dependencies:
  flutter_test:
    sdk: flutter

  very_good_analysis: ^10.0.0
  flutter_lints: ^6.0.0

  # app icon generator
  flutter_launcher_icons: ^0.14.4
  # dart run build_runner build --delete-conflicting-outputs
  build_runner: ^2.10.5
  freezed: ^3.2.4
  json_serializable: ^6.11.4


flutter:
  uses-material-design: true

  assets:
    - .env.dev
    - .env.prod
    - assets/images/
    - assets/icons/
    - lang/ar.json
    - lang/en.json
    - assets/images/admin/
    - assets/images/core/
    - assets/images/customer/
    

  fonts:
    - family: Cairo
      fonts:
        - asset: assets/fonts/arabic/cairo/Cairo-Bold.ttf
          weight: 700
        - asset: assets/fonts/arabic/cairo/Cairo-Medium.ttf
          weight: 500
        - asset: assets/fonts/arabic/cairo/Cairo-Regular.ttf
          weight: 400

    - family: Poppins
      fonts:
        - asset: assets/fonts/english/poppins/Poppins-Bold.ttf
          weight: 700
        - asset: assets/fonts/english/poppins/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/english/poppins/Poppins-Regular.ttf
          weight: 400


flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icons/app_icon.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/icons/app_icon.png"
